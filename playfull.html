<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTTv2 - Multiplayer Server</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    /* CSS cho màn hình Sảnh (Lobby) */
    #lobby-container {
      background-color: var(--surface-color);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      width: 400px;
      margin: 50px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .lobby-input {
      padding: 10px;
      width: 60%;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Oẳn Tù Tì v2</h1>
    <p>Chơi 2 người thời gian thực</p>
  </header>

  <!-- MÀN HÌNH SẢNH: CHỌN HOẶC TẠO PHÒNG -->
  <div id="lobby-container">
    <h2 style="margin-bottom: 20px;">Tham gia trò chơi</h2>
    
    <button id="btn-create-room" class="btn-restart" style="width: 100%; margin-bottom: 20px; background-color: #2563eb; padding: 12px;">
      Tạo phòng mới
    </button>
    
    <div style="display: flex; align-items: center; justify-content: center;">
      <hr style="flex: 1; border-color: #475569;">
      <span style="padding: 0 10px; color: #cbd5e1;">HOẶC</span>
      <hr style="flex: 1; border-color: #475569;">
    </div>

    <div style="margin-top: 20px; display: flex; justify-content: center;">
      <input type="text" id="input-room-code" class="lobby-input" placeholder="Nhập mã phòng (vd: ott_123)">
      <button id="btn-join-room" class="btn-restart" style="background-color: #059669;">Vào phòng</button>
    </div>
  </div>

  <!-- MÀN HÌNH GAME (Ẩn lúc đầu) -->
  <main class="game-container" id="game-container" style="display: none;">
    
    <div style="display: flex; gap: 8px; width: 540px; margin-bottom: 4px; align-items: center; background: #1e293b; padding: 10px; border-radius: 6px;">
      <span style="color: #cbd5e1; white-space: nowrap;">Mã phòng:</span>
      <input type="text" id="display-room-code" readonly style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-weight: bold; text-align: center;">
      <button id="btn-copy" class="btn-restart" style="background-color: #059669;">Copy Mã</button>
    </div>

    <div class="scoreboard">
      <div id="p1-panel" class="player-panel p1">
        <span class="name">Player 1 (Hàng 1 → Đích i9)</span>
        <span id="p1-score" class="piece-counts">👊 3 | ✌️ 3 | ✋ 3</span>
      </div>
      <div id="p2-panel" class="player-panel p2">
        <span class="name">Player 2 (Hàng 9 → Đích a1)</span>
        <span id="p2-score" class="piece-counts">👊 3 | ✌️ 3 | ✋ 3</span>
      </div>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board"></div>
    </div>

    <div class="status-bar">
      <div id="status-text">Đang kết nối...</div>
      <button id="btn-restart" class="btn-restart">Ván mới</button>
    </div>
  </main>

  <script type="module" src="js/network/client.js?v=2"></script>

</body>
</html>
