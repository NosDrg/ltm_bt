<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oẳn Tù Tì v2 (OTTv2) - 9x9 Board Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Oẳn Tù Tì v2 (OTTv2)</h1>
    <p>Bàn cờ 9×9 — Di chuyển 8 hướng — Ăn hết 1 loại quân hoặc về đích đối diện</p>
  </header>

  <main class="game-container">
    <section id="start-menu" class="start-menu">
      <div class="menu-mark">OTTv2</div>
      <h2>Chọn chế độ chơi</h2>
      <p>Đưa quân về ô đích hoặc tiêu diệt một loại quân của đối thủ.</p>
      <div class="mode-actions">
        <button id="btn-vs-computer" class="mode-button primary">Chơi với máy</button>
        <button id="btn-vs-player" class="mode-button">Hai người chơi</button>
      </div>
    </section>

    <section id="game-screen" class="game-screen hidden">
    <!-- Bảng điểm & Số quân -->
    <div class="scoreboard">
      <div id="p1-panel" class="player-panel p1">
        <span class="name">Player 1 (Hàng 1 → Đích i9)</span>
        <span id="p1-score" class="piece-counts">👊 3 | ✌️ 3 | ✋ 3</span>
      </div>
      <div id="p2-panel" class="player-panel p2">
        <span class="name">Player 2 (Hàng 9 → Đích a1)</span>
        <span id="p2-score" class="piece-counts">👊 3 | ✌️ 3 | ✋ 3</span>
      </div>
    </div>

    <!-- Bàn cờ 9x9 -->
    <div class="board-wrapper">
      <div id="board" class="board"></div>
    </div>

    <!-- Thanh trạng thái và nút Chơi lại -->
    <div class="status-bar">
      <div id="status-text">Lượt đi: Player 1</div>
      <div class="status-actions">
        <button id="btn-menu" class="btn-secondary">Menu</button>
        <button id="btn-restart" class="btn-restart">Chơi lại</button>
      </div>
    </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
